name: Auto-update scrapers

# Diariamente (e sob demanda) atualiza app-store-scraper e google-play-scraper
# para a versao mais recente. Se algo mudou: commita, empurra na main e dispara
# o publish.yml (que faz bump + tag + publish em cima).
#
# O push aqui usa o GITHUB_TOKEN padrao (nao dispara o release sozinho), por isso
# chamamos o publish.yml explicitamente via workflow_dispatch. Sem PAT.

on:
  schedule:
    - cron: '0 6 * * *' # todo dia, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write # empurrar o commit de atualizacao
  actions: write # disparar o publish.yml

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Update scrapers to latest
        run: npm install app-store-scraper@latest google-play-scraper@latest

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma atualizacao de scraper disponivel."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- package.json
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): update store scrapers to latest"
          git push origin HEAD:main

      - name: Trigger release
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref main
