name: Auto-update scrapers

# Diariamente (e sob demanda) atualiza app-store-scraper e google-play-scraper
# para a versao mais recente. Se algo mudou: sobe um patch, empurra o commit/tag
# e dispara o publish.yml. O consumidor que roda `npx -y mcp-store-scraper@latest`
# passa a receber a nova versao do MCP e, com ela, o scraper mais recente.
#
# Totalmente automatico: nao exige nenhum segredo/PAT alem do GITHUB_TOKEN padrao.

on:
  schedule:
    - cron: '0 6 * * *' # todo dia, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write # empurrar commit + tag
  actions: write # disparar o publish.yml via workflow_dispatch

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Update scrapers to latest
        run: npm install app-store-scraper@latest google-play-scraper@latest

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma atualizacao de scraper disponivel."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- package.json
          fi

      - name: Sanity build
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Commit and version bump
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): update store scrapers to latest"
          npm version patch -m "chore(release): %s"
          git push origin HEAD --follow-tags

      - name: Trigger publish
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref "${{ github.ref_name }}"
