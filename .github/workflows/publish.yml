name: Release and Publish

# A cada push na main: sobe um patch, cria a tag, e publica no npm.
# Como cada push gera uma versao nova, nunca ha colisao de "versao ja publicada".
#
# Anti-loop: o commit de bump e empurrado com o GITHUB_TOKEN padrao, e push com
# esse token NAO dispara novos workflows. O guard por mensagem e uma camada extra.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC / npm trusted publishing
  contents: write # empurrar commit de bump + tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # ignora o proprio commit de bump feito pelo bot (camada extra anti-loop)
    if: ${{ !contains(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch, tag and push
        run: |
          npm version patch -m "chore(release): %s"
          git push origin HEAD:main --follow-tags

      - name: Publish if version is new
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION ja publicado no npm — pulando."
          else
            npm publish
          fi
